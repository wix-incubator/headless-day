<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080814"/>
      <stop offset="55%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#1a0a08"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="28%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="68%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <!-- Lava glow at volcano crater -->
    <radialGradient id="lavaGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ff6600" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <!-- Table warm glow -->
    <radialGradient id="tableGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#c8701a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c8701a" stop-opacity="0"/>
    </radialGradient>
    <!-- Dice faces -->
    <linearGradient id="diceFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e0d8c0"/>
    </linearGradient>
    <linearGradient id="diceRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8bb98"/>
      <stop offset="100%" stop-color="#a89870"/>
    </linearGradient>
    <linearGradient id="diceTopFace" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ddd5b8"/>
      <stop offset="100%" stop-color="#f0e8d0"/>
    </linearGradient>
    <filter id="diceShadow">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="auroraWave" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.07" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="craterGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Stars -->
  <g>
    <circle cx="45" cy="28" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="112" cy="55" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="189" cy="18" r="1.4" fill="white" opacity="0.9"/>
    <circle cx="234" cy="72" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="310" cy="35" r="1.1" fill="white" opacity="0.7"/>
    <circle cx="380" cy="15" r="0.9" fill="white" opacity="0.8"/>
    <circle cx="442" cy="48" r="1.3" fill="white" opacity="0.6"/>
    <circle cx="520" cy="22" r="1.0" fill="white" opacity="0.9"/>
    <circle cx="590" cy="60" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="660" cy="12" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="735" cy="44" r="1.0" fill="white" opacity="0.7"/>
    <circle cx="810" cy="28" r="1.4" fill="white" opacity="0.6"/>
    <circle cx="875" cy="70" r="0.9" fill="white" opacity="0.8"/>
    <circle cx="950" cy="18" r="1.1" fill="white" opacity="0.9"/>
    <circle cx="1020" cy="52" r="0.8" fill="white" opacity="0.6"/>
    <circle cx="1090" cy="30" r="1.3" fill="white" opacity="0.7"/>
    <circle cx="1155" cy="65" r="1.0" fill="white" opacity="0.5"/>
    <circle cx="78" cy="105" r="0.7" fill="white" opacity="0.4"/>
    <circle cx="155" cy="88" r="1.0" fill="white" opacity="0.6"/>
    <circle cx="270" cy="115" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="425" cy="95" r="1.1" fill="white" opacity="0.7"/>
    <circle cx="555" cy="82" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="700" cy="108" r="0.8" fill="white" opacity="0.4"/>
    <circle cx="840" cy="92" r="1.0" fill="white" opacity="0.7"/>
    <circle cx="985" cy="78" r="0.9" fill="white" opacity="0.5"/>
    <circle cx="1120" cy="100" r="1.2" fill="white" opacity="0.6"/>
  </g>

  <!-- Aurora borealis bands -->
  <g filter="url(#auroraWave)">
    <ellipse cx="280" cy="155" rx="400" ry="55" fill="none" stroke="#00ff88" stroke-width="30" stroke-opacity="0.14"/>
    <ellipse cx="720" cy="125" rx="360" ry="48" fill="none" stroke="#aa44ff" stroke-width="24" stroke-opacity="0.17"/>
    <ellipse cx="540" cy="175" rx="480" ry="38" fill="none" stroke="#00ccff" stroke-width="18" stroke-opacity="0.10"/>
  </g>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>
  <rect width="1200" height="630" fill="url(#aurora3)"/>

  <!-- ===== ICELAND LANDSCAPE ===== -->

  <!-- Far background ridge (lightest) -->
  <polygon points="0,430 120,360 200,390 300,345 400,375 480,330 560,360 640,420 700,400 800,430" fill="#12122a" opacity="0.7"/>

  <!-- Left mountain range -->
  <polygon points="0,430 60,350 110,375 170,315 230,360 280,430" fill="#0f0f22"/>

  <!-- Volcano — Hekla-style stratovolcano, centre-right -->
  <!-- Lava glow behind crater -->
  <ellipse cx="880" cy="248" rx="55" ry="12" fill="#ff5500" opacity="0.25" filter="url(#craterGlow)"/>
  <ellipse cx="880" cy="248" rx="30" ry="7" fill="#ff7700" opacity="0.35" filter="url(#craterGlow)"/>
  <!-- Volcano body — classic steep cone -->
  <path d="M 720,430 Q 760,400 800,360 Q 830,320 855,278 Q 865,258 880,248 Q 895,258 905,278 Q 930,320 960,360 Q 990,400 1030,430 Z" fill="#0e0e20"/>
  <!-- Volcano left flank shading (slightly lighter) -->
  <path d="M 855,278 Q 830,320 800,360 Q 760,400 720,430 L 800,430 Q 840,410 865,370 Q 880,340 880,310 Z" fill="#16162e" opacity="0.6"/>
  <!-- Crater rim -->
  <ellipse cx="880" cy="252" rx="28" ry="8" fill="none" stroke="#1e1e3a" stroke-width="3"/>
  <!-- Lava inside crater -->
  <ellipse cx="880" cy="252" rx="22" ry="6" fill="#cc3300" opacity="0.70"/>
  <ellipse cx="880" cy="250" rx="14" ry="4" fill="#ff6600" opacity="0.85"/>
  <ellipse cx="880" cy="249" rx="7" ry="2.5" fill="#ffaa00" opacity="0.9"/>
  <!-- Steam/smoke wisps from crater -->
  <g opacity="0.25" fill="#c8d8e8">
    <ellipse cx="874" cy="232" rx="5" ry="10" transform="rotate(-12, 874, 232)"/>
    <ellipse cx="882" cy="225" rx="4" ry="12" transform="rotate(8, 882, 225)"/>
    <ellipse cx="890" cy="228" rx="4" ry="9" transform="rotate(20, 890, 228)"/>
  </g>
  <!-- Glacier cap on volcano (partial snow) -->
  <path d="M 855,278 Q 862,268 868,260 Q 874,253 880,248 Q 886,253 892,260 Q 898,268 905,278 Q 895,272 885,270 Q 880,268 875,270 Q 865,272 855,278 Z" fill="#d0e8f4" opacity="0.55"/>

  <!-- Lava glow light cast from crater onto surroundings -->
  <radialGradient id="lavaRadial" cx="880" cy="252" r="120" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ff4400" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
  </radialGradient>
  <rect x="780" y="200" width="200" height="230" fill="url(#lavaRadial)"/>

  <!-- Right mountains beside volcano -->
  <polygon points="980,430 1050,355 1100,380 1150,335 1200,360 1200,430" fill="#0f0f22"/>

  <!-- Ground fill -->
  <rect x="0" y="425" width="1200" height="10" fill="#0d0d1c"/>

  <!-- Warm table glow overlay -->
  <rect width="1200" height="630" fill="url(#tableGlow)"/>

  <!-- Table surface -->
  <rect x="0" y="430" width="1200" height="200" fill="#241508"/>
  <line x1="0" y1="452" x2="1200" y2="446" stroke="#321c0a" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="476" x2="1200" y2="471" stroke="#321c0a" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="500" x2="1200" y2="496" stroke="#321c0a" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="526" x2="1200" y2="522" stroke="#180c04" stroke-width="3" opacity="0.4"/>
  <ellipse cx="600" cy="430" rx="520" ry="38" fill="#c4601a" opacity="0.10"/>
  <rect x="0" y="428" width="1200" height="5" fill="#3e2510" opacity="0.9"/>

  <!-- ===== DICE — correct perspective: depth offset goes RIGHT and UP (+28, -20) ===== -->
  <!--
    Front face = rect(0,0,W,W)
    Right face  = TR(W,0)→ TR_back(W+dx,−dy)→ BR_back(W+dx,W−dy)→ BR(W,W)
    Top face    = TL(0,0)→ TR(W,0)→ TR_back(W+dx,−dy)→ TL_back(dx,−dy)
    Depth (big):   dx=30 dy=22  →  offset (+30, −22)
    Depth (med):   dx=23 dy=17
    Depth (sml):   dx=18 dy=13
  -->

  <!-- Big die (showing 6) — rotate -18° -->
  <g filter="url(#diceShadow)" transform="translate(600, 320) rotate(-18)">
    <!-- Top face -->
    <polygon points="0,0 130,0 160,-22 30,-22" fill="url(#diceTopFace)" stroke="#b0a080" stroke-width="1.2"/>
    <!-- Right face -->
    <polygon points="130,0 160,-22 160,108 130,130" fill="url(#diceRight)" stroke="#b0a080" stroke-width="1.2"/>
    <!-- Front face -->
    <rect x="0" y="0" width="130" height="130" fill="url(#diceFront)" stroke="#b0a080" stroke-width="1.5"/>
    <!-- 6 pips on front -->
    <circle cx="34" cy="34" r="9" fill="#1a1208"/>
    <circle cx="65" cy="34" r="9" fill="#1a1208"/>
    <circle cx="96" cy="34" r="9" fill="#1a1208"/>
    <circle cx="34" cy="96" r="9" fill="#1a1208"/>
    <circle cx="65" cy="96" r="9" fill="#1a1208"/>
    <circle cx="96" cy="96" r="9" fill="#1a1208"/>
    <!-- 2 pips on right face: (u=0.5,v=0.25)→(145,22) (u=0.5,v=0.75)→(145,87) -->
    <circle cx="145" cy="22" r="5" fill="#8a7855" opacity="0.75"/>
    <circle cx="145" cy="87" r="5" fill="#8a7855" opacity="0.75"/>
    <!-- Top face 1 pip: (u=0.5,v=0.5)→(80,-11) -->
    <circle cx="80" cy="-11" r="5" fill="#8a7855" opacity="0.65"/>
  </g>

  <!-- Medium die (showing 4) — rotate +26° -->
  <g filter="url(#diceShadow)" transform="translate(428, 375) rotate(26)">
    <!-- Top face -->
    <polygon points="0,0 100,0 123,-17 23,-17" fill="url(#diceTopFace)" stroke="#b0a080" stroke-width="1.2"/>
    <!-- Right face -->
    <polygon points="100,0 123,-17 123,83 100,100" fill="url(#diceRight)" stroke="#b0a080" stroke-width="1.2"/>
    <!-- Front face -->
    <rect x="0" y="0" width="100" height="100" fill="url(#diceFront)" stroke="#b0a080" stroke-width="1.5"/>
    <!-- 4 pips -->
    <circle cx="27" cy="27" r="7.5" fill="#1a1208"/>
    <circle cx="73" cy="27" r="7.5" fill="#1a1208"/>
    <circle cx="27" cy="73" r="7.5" fill="#1a1208"/>
    <circle cx="73" cy="73" r="7.5" fill="#1a1208"/>
    <!-- 2 pips on right face: (u=0.5,v=0.25)→(112,17) (u=0.5,v=0.75)→(112,67) -->
    <circle cx="112" cy="17" r="4" fill="#8a7855" opacity="0.70"/>
    <circle cx="112" cy="67" r="4" fill="#8a7855" opacity="0.70"/>
  </g>

  <!-- Small die (showing 2) — rotate -7° -->
  <g filter="url(#diceShadow)" transform="translate(748, 400) rotate(-7)">
    <!-- Top face -->
    <polygon points="0,0 80,0 98,-13 18,-13" fill="url(#diceTopFace)" stroke="#b0a080" stroke-width="1.2"/>
    <!-- Right face -->
    <polygon points="80,0 98,-13 98,67 80,80" fill="url(#diceRight)" stroke="#b0a080" stroke-width="1.2"/>
    <!-- Front face -->
    <rect x="0" y="0" width="80" height="80" fill="url(#diceFront)" stroke="#b0a080" stroke-width="1.5"/>
    <!-- 2 pips -->
    <circle cx="22" cy="22" r="6" fill="#1a1208"/>
    <circle cx="58" cy="58" r="6" fill="#1a1208"/>
    <!-- Top face 1 pip: (u=0.5,v=0.5)→(49,-7) -->
    <circle cx="49" cy="-7" r="3.5" fill="#8a7855" opacity="0.65"/>
  </g>

  <!-- Motion streaks near big die -->
  <g opacity="0.30" stroke="#f0d090" stroke-width="2" stroke-linecap="round">
    <line x1="575" y1="308" x2="538" y2="278"/>
    <line x1="585" y1="318" x2="542" y2="293"/>
    <line x1="594" y1="310" x2="552" y2="288"/>
  </g>

  <!-- ===== BRAND TEXT ===== -->
  <text x="600" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="74" font-weight="700" fill="#f5e8c8" letter-spacing="3" filter="url(#textGlow)" opacity="0.97">Dice &amp; Drizzle</text>
  <text x="600" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#d4b870" letter-spacing="6" opacity="0.90">REYKJAVÍK · BOARD GAME BAR</text>
  <line x1="380" y1="256" x2="820" y2="256" stroke="#d4b870" stroke-width="1" opacity="0.45"/>
  <circle cx="600" cy="256" r="3" fill="#d4b870" opacity="0.65"/>
  <text x="600" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#c8b888" opacity="0.85" letter-spacing="1">Roll the dice. Taste Iceland.</text>

  <!-- Decorative dice icons flanking title -->
  <g transform="translate(196,162)" opacity="0.55">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#d4b870" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="2.5" fill="#d4b870"/>
    <circle cx="15" cy="15" r="2.5" fill="#d4b870"/>
  </g>
  <g transform="translate(982,162)" opacity="0.55">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#d4b870" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="2.5" fill="#d4b870"/>
    <circle cx="15" cy="7" r="2.5" fill="#d4b870"/>
    <circle cx="7" cy="15" r="2.5" fill="#d4b870"/>
    <circle cx="15" cy="15" r="2.5" fill="#d4b870"/>
  </g>
</svg>
